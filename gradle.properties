# Disable Gradle Configuration Cache temporarily to avoid issues
org.gradle.configuration-cache=false
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# Disable Kotlin K2 compiler mode for better compatibility
kotlin.experimental.use.k2=false

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Configure Gradle to use JDK 21

# Disable the IntelliJ Platform Gradle plugin self-update check.
# It fetches from plugins.gradle.org which is blocked by ZScaler on CrowdStrike networks.
org.jetbrains.intellij.platform.selfUpdateCheck=false

# Redirect Android Studio releases list to a local stub — jb.gg is blocked by ZScaler in CI.
# The list is only needed for Android Studio plugin development, not IntelliJ IDEA plugins.
# Property name derived from GradleProperties.kt line 24: org.jetbrains.intellij.platform.<camelCase>
org.jetbrains.intellij.platform.productsReleasesAndroidStudioUrl=file:///dev/null
